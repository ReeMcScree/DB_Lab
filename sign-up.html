
<!DOCTYPE html>
<html lang="en">
<head>
   <title>Sign Up</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css"
         rel="stylesheet">
   <link rel="stylesheet" href="style.css">

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
   <!-- NAV -->
   <nav class="navbar navbar-expand bg-secondary">
      <div class="container-fluid justify-content-center">
         <div class="navbar-nav">
            <a class="nav-link text-white" href="index.html">Dashboard</a>
            <a class="nav-link text-white" href="checkout.html">Checkout</a>
            <a class="nav-link text-white" href="sign-in.html">Sign In</a>
            <a class="nav-link text-white" href="sign-up.html">Sign Up</a>
         </div>
      </div>
   </nav>

   <!-- FORM -->
   <div class="col-md-4 mx-auto mt-5">
      <form>
         <div class="row">
            <div class="col-6">
               <!-- First Name -->
               <label for="firstName">First Name</label><br>
               <input type="text" class="form-control form-control-lg"
                      id="firstName" name="firstName"
                      placeholder="First Name" required
                      pattern="[A-Za-z]+"><br><br>
            </div>

            <div class="col-6">
               <!-- Last Name -->
               <label for="lastName">Last Name</label><br>
               <input type="text" class="form-control form-control-lg"
                      id="lastName" name="lastName"
                      placeholder="Last Name" required
                      pattern="[A-Za-z]+"><br><br>
            </div>
         </div>

         <div class="row">
            <div class="col-12">
               <!-- Email -->
               <label for="email">E-Mail</label><br>
               <input type="email" class="form-control form-control-lg"
                      id="email" name="email"
                      placeholder="name@example.com" required><br><br>
            </div>
         </div>

         <div class="row">
            <div class="col-12">
               <!-- Username -->
               <label for="username">Username</label><br>
               <input type="text" class="form-control form-control-lg"
                      id="username" name="username"
                      placeholder="Username" required
                      pattern="[A-Za-z_-]+"><br><br>
            </div>
         </div>

         <div class="row">
            <div class="col-12">
               <!-- Password -->
               <label for="password">Password</label><br>
               <input type="password" class="form-control form-control-lg"
                      id="password" name="password"
                      placeholder="Password" required><br><br>
            </div>
         </div>

         <div class="row">
            <div class="col-12">
               <!-- Re-enter Password -->
               <label for="confirm_password">Re-enter Password</label><br>
               <input type="password" class="form-control form-control-lg"
                      id="confirm_password" name="confirm_password"
                      placeholder="Re-enter Password" required><br><br>
            </div>
         </div>

         <div class="row mt-3">
            <div class="col-auto">
               <button type="submit" class="btn btn-primary mt-3">
                  Sign Up
               </button>
            </div>
         </div>
      </form>
   </div>

   <footer class="text-center py-3 mt-5">
      <p>Terms and Conditions</p>
      <p>Privacy Policy</p>
      <p>Cookie Policy</p>
   </footer>
</body>
</html>
